name: Scrape It Six Runner Scan
on:
  workflow_dispatch:
  push:
    branches: [scrape-it]
    paths:
      - '.github/workflows/scrape-it-six-runner.yml'
      - 'scripts/dealer-browser-scan.mjs'
permissions:
  contents: read
  id-token: write
jobs:
  scan1:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DEALER_IDS: 110,117,140,155,163
    steps:
      - uses: actions/checkout@v4
        with:
          ref: scrape-it
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: node scripts/dealer-browser-scan.mjs
