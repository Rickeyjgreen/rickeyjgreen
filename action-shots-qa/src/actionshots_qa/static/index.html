<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Action Shots Photo QA</title>
  <style>
    :root{font-family:Inter,Segoe UI,sans-serif;color:#eef2ff;background:#0b1020}body{max-width:1180px;margin:auto;padding:24px}
    h1{margin:0 0 6px}.muted{color:#9aa7c7}.panel{background:#151d33;border:1px solid #2a3658;border-radius:14px;padding:18px;margin:16px 0}
    input{width:100%;box-sizing:border-box;background:#0c1326;color:white;border:1px solid #3a486d;border-radius:8px;padding:11px;margin:6px 0 12px}
    button{background:#45d483;color:#07140c;border:0;border-radius:8px;padding:10px 15px;font-weight:700;cursor:pointer;margin:4px}button:disabled{opacity:.45;cursor:not-allowed}
    button.secondary{background:#33405f;color:white}.danger{background:#ffbd59;color:#211400}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
    .card{background:#0d1428;border:2px solid transparent;border-radius:10px;padding:8px}.card img{width:100%;aspect-ratio:4/3;object-fit:contain;background:#050810;border-radius:7px}
    .card.selected{border-color:#45d483}.pill{display:inline-block;padding:3px 8px;border-radius:20px;background:#263454;margin-right:6px}.hidden{display:none}
    pre{white-space:pre-wrap;color:#b8c5e6}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.ok{color:#45d483}.error{color:#ff8f8f}
  </style>
</head>
<body>
  <h1>Action Shots Photo QA</h1><div class="muted">Local processing. Photos and face data never leave this workstation.</div>
  <section class="panel">
    <h2>Start tagged shoot</h2>
    <label>Shoot folder</label><input id="shoot" placeholder="D:\Photo Jobs\Colts">
    <label>GotPhoto CSV/XLSX export</label><input id="roster" placeholder="D:\Photo Jobs\Colts\roster.xlsx">
    <label><input id="cpu" type="checkbox" style="width:auto"> Explicitly allow CPU fallback if CUDA fails (slower)</label><br>
    <button id="analyzeButton" onclick="startJob()">Analyze shoot</button><button class="secondary" onclick="diagnose()">Diagnose GPU</button>
    <pre id="status"></pre>
  </section>
  <section class="panel"><div class="toolbar"><h2 style="margin-right:auto">Jobs</h2><button class="secondary" onclick="loadJobs()">Refresh</button></div><div id="jobs"></div></section>
  <section id="reviewPanel" class="panel hidden">
    <div class="toolbar"><h2 style="margin-right:auto">Exception review</h2><span id="counter" class="pill"></span></div>
    <h3 id="reason"></h3><div id="code" class="muted"></div><div id="candidates" class="grid"></div>
    <div class="toolbar"><button id="winnerButton" onclick="winner()">Save selected as 5-star (Enter)</button><button class="secondary" onclick="group()">Mark selected 3-star (G)</button><button class="secondary" onclick="splitIdentity()">Split selected person (X)</button><button class="secondary" onclick="mergeIdentity()">Merge identity (M)</button><button class="secondary" onclick="resolve('skip')">Accept unstarred (S)</button><button class="secondary" onclick="previous()">Previous (←)</button><button onclick="next()">Next (→)</button></div>
    <div id="reviewStatus" class="muted">Press 1–4 to highlight a candidate, then Enter to save it.</div>
  </section>
  <section id="selectionPanel" class="panel hidden">
    <div class="toolbar"><h2 style="margin-right:auto">Proposed selections</h2><span id="selectionCounter" class="pill"></span><button class="secondary" onclick="closeSelections()">Close</button></div>
    <div id="selectionGrid" class="grid"></div>
  </section>
<script>
let activeJob=null, exceptions=[], index=0, selected=null, saving=false;
const el=id=>document.getElementById(id);
const escapeHtml=value=>String(value??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
async function api(url,options={}){let r=await fetch(url,{headers:{'Content-Type':'application/json'},...options});let body=await r.json().catch(()=>({detail:r.statusText}));if(!r.ok)throw Error(body.detail||JSON.stringify(body));return body}
async function diagnose(){try{el('status').textContent=JSON.stringify(await api('/api/hardware?allow_cpu_fallback='+el('cpu').checked),null,2)}catch(e){el('status').textContent=e.message}}
async function startJob(){let button=el('analyzeButton'),output=el('status');button.disabled=true;output.textContent='Checking NVIDIA GPU and local AI models…';try{let body=await api('/api/jobs',{method:'POST',body:JSON.stringify({shoot_folder:el('shoot').value,roster_file:el('roster').value,allow_cpu_fallback:el('cpu').checked})});activeJob=body.job_id;output.textContent='Analysis started: '+activeJob;await loadJobs()}catch(e){output.textContent='Could not start analysis:\n'+e.message}finally{button.disabled=false}}
async function resumeJob(id){el('status').textContent='Resuming '+id+'…';try{await api(`/api/jobs/${id}/resume?allow_cpu_fallback=${el('cpu').checked}`,{method:'POST'});await loadJobs()}catch(e){el('status').textContent=e.message}}
async function loadJobs(){let data=await api('/api/jobs');el('jobs').innerHTML=data.length?data.map(j=>{let progress=j.total_images!=null?`${j.processed_images||0} / ${j.total_images} images`:`${j.processed_images||0} images processed`;let canWrite=j.status==='READY_TO_WRITE';let canResume=['INTERRUPTED','FAILED'].includes(j.status);return `<div class="panel"><b>${escapeHtml(j.id)}</b> <span class="pill">${escapeHtml(j.status)}</span> <span class="pill">${progress}</span><br><span class="muted">${escapeHtml(j.source_path)}</span><br><span class="pill">5-star: ${j.five_star||0}</span><span class="pill">3-star: ${j.three_star||0}</span><span class="pill">review: ${j.open_exceptions||0}</span><br><button class="secondary" onclick="review('${j.id}')">Review exceptions</button><button class="secondary" onclick="inspectSelections('${j.id}')">Inspect selections</button>${canResume?`<button class="secondary" onclick="resumeJob('${j.id}')">Resume</button>`:''}<button class="danger" ${canWrite?'':'disabled'} onclick="finalize('${j.id}')">Verify & write ratings</button>${j.error?'<pre>'+escapeHtml(j.error)+'</pre>':''}</div>`}).join(''):'No jobs yet.';if(data.some(j=>['CREATED','ANALYZING','WRITING'].includes(j.status)))setTimeout(loadJobs,2000)}
async function review(id){activeJob=id;exceptions=await api(`/api/jobs/${id}/exceptions`);index=0;selected=null;el('reviewPanel').classList.remove('hidden');render(true)}
function render(resetSelection=false){if(!exceptions.length){el('reason').textContent='No open exceptions';el('code').textContent='Ready to verify and write ratings.';el('candidates').innerHTML='';el('counter').textContent='0 remaining';el('reviewStatus').textContent='All required decisions are complete.';return}let item=exceptions[index],ids=item.candidates.map(c=>c.id);if(resetSelection||!ids.includes(selected))selected=ids[0]||null;el('reason').textContent=item.reason.replaceAll('_',' ');el('code').textContent=`Code: ${item.copyright_code||'missing'} · Cluster: ${item.cluster_id||'n/a'}`;el('counter').textContent=`${index+1} / ${exceptions.length}`;el('candidates').innerHTML=item.candidates.map((c,i)=>`<div class="card ${c.id===selected?'selected':''}" onclick="select(${c.id})"><img src="/api/images/${c.id}/proxy"><b>${i+1}. ${escapeHtml(c.relative_path)}</b><div class="muted">score ${(c.portrait_score??0).toFixed(3)} · faces ${c.face_count??0}</div></div>`).join('');el('reviewStatus').textContent=selected?`Candidate ${ids.indexOf(selected)+1} selected. Press Enter or click Save selected as 5-star.`:'No candidate available.'}
function select(id){selected=id;render(false)}
async function resolve(action,extra={}){if(!exceptions.length||saving)return;let item=exceptions[index];if(action!=='skip'&&!selected)return;saving=true;el('reviewStatus').textContent='Saving decision…';try{await api(`/api/exceptions/${item.id}/resolve`,{method:'POST',body:JSON.stringify({action,image_id:selected,...extra})});let nextId=exceptions[index+1]?.id;exceptions=await api(`/api/jobs/${activeJob}/exceptions`);if(nextId){let nextIndex=exceptions.findIndex(e=>e.id===nextId);index=nextIndex>=0?nextIndex:Math.min(index,Math.max(0,exceptions.length-1))}else index=Math.min(index,Math.max(0,exceptions.length-1));selected=null;render(true);loadJobs()}catch(e){el('reviewStatus').textContent='Could not save: '+e.message}finally{saving=false}}
function winner(){resolve('winner')} function group(){resolve('group')} function splitIdentity(){resolve('split')} function mergeIdentity(){let target=Number(prompt('Target cluster ID to merge into:'));if(target)resolve('merge',{target_cluster_id:target})} function next(){if(index<exceptions.length-1){index++;selected=null;render(true)}} function previous(){if(index>0){index--;selected=null;render(true)}}
async function inspectSelections(id){activeJob=id;let data=await api(`/api/jobs/${id}/selections`);el('selectionCounter').textContent=`${data.length} selected`;el('selectionGrid').innerHTML=data.map(c=>`<div class="card"><img src="/api/images/${c.id}/proxy"><b>${escapeHtml(c.relative_path)}</b><div><span class="pill">${c.proposed_rating}-star</span><span class="pill">faces ${c.face_count??0}</span></div><div class="muted">Code ${escapeHtml(c.copyright_code||'missing')} · score ${(c.portrait_score??0).toFixed(3)}</div></div>`).join('');el('selectionPanel').classList.remove('hidden');el('selectionPanel').scrollIntoView({behavior:'smooth'})}
function closeSelections(){el('selectionPanel').classList.add('hidden')}
async function finalize(id){if(!confirm('Write and verify ratings on the ORIGINAL JPEGs now? This also clears non-selected images to 0 stars. Every change is backed up and verified.'))return;try{el('status').textContent=JSON.stringify(await api(`/api/jobs/${id}/finalize`,{method:'POST'}),null,2);loadJobs()}catch(e){el('status').textContent=e.message}}
document.addEventListener('keydown',event=>{if(el('reviewPanel').classList.contains('hidden')||['INPUT','TEXTAREA'].includes(event.target.tagName))return;let key=event.key.toLowerCase();if(event.key>='1'&&event.key<='4'){let candidate=exceptions[index]?.candidates[Number(event.key)-1];if(candidate)select(candidate.id)}else if(key==='g')group();else if(key==='s')resolve('skip');else if(key==='x')splitIdentity();else if(key==='m')mergeIdentity();else if(event.key==='ArrowRight')next();else if(event.key==='ArrowLeft')previous();else if(event.key==='Enter')winner()});loadJobs();
</script></body></html>
